<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Timer Loop</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1f6feb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Timer Loop">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
:root{color-scheme:light dark;
  --bg:light-dark(#f5f7fa,#0f141a);--surface:light-dark(#fff,#18202a);--text:light-dark(#1b2430,#e8edf3);
  --muted:light-dark(#5b6675,#9aa7b6);--primary:light-dark(#1f6feb,#6aa6ff);--on:light-dark(#fff,#0b1220);
  --danger:light-dark(#c62828,#ff7b72);--border:light-dark(#d8dee6,#2f3b49);--soft:light-dark(#eef2f7,#212b37);--ok:light-dark(#1a7f37,#4cc26b);--warn:light-dark(#9a5b00,#f0b04a)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;min-height:100dvh;-webkit-tap-highlight-color:transparent}
.wrap{max-width:520px;margin:0 auto;padding:16px 16px 40px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ttl{font-weight:700;font-size:18px;flex:1;text-align:center}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.time{font-size:clamp(56px,18vw,80px);font-weight:700;text-align:center;margin:8px 0 0}
.sub{text-align:center;color:var(--muted)}
.lap{width:100%;min-height:110px;margin-top:16px;border:0;border-radius:16px;background:var(--primary);color:var(--on);font-size:28px;font-weight:700}
.lap:active{transform:scale(.98)}
.ctrl{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.btn{min-height:52px;padding:0 14px;border-radius:12px;border:1px solid var(--border);background:var(--surface)}
.btn:disabled{opacity:.4}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.pri{background:var(--primary);color:var(--on);border-color:var(--primary);font-weight:700}
.list{margin-top:14px;background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.item{display:flex;align-items:center;justify-content:space-between;padding:4px 6px 4px 16px;min-height:56px;border-bottom:1px solid var(--border)}
.item:last-child{border-bottom:0}
.item .n{color:var(--muted);width:3em}
.item .s{flex:1;font-size:20px;font-weight:600;text-align:right;padding-right:12px}
.del{width:48px;height:48px;border:0;background:none;color:var(--danger);border-radius:10px;flex:none}
.del svg{width:22px;height:22px}
.empty{padding:20px;text-align:center;color:var(--muted)}
.boxes{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin-top:18px}
.foot{background:var(--surface);border:2px solid var(--primary);border-radius:12px;padding:10px 12px;text-align:left;display:block;width:100%;font:inherit;color:var(--text)}
.foot.side{border-color:var(--ok,#1a7f37);cursor:pointer}
.foot.side:active{transform:scale(.98)}
.foot .k{padding:3px 0}
.foot .k span{display:block;font-size:13px;color:var(--muted)}
.foot .k b{font-size:20px;white-space:nowrap}
.foot .big{font-size:28px!important;font-weight:700;color:var(--primary)}
.foot.side .big{color:var(--ok,#1a7f37)}
.foot small{display:block;font-size:13px;color:var(--muted)}
.foot .f{color:var(--muted);font-size:12px;margin-top:4px;line-height:1.3}
h2{font-size:18px;margin:0}
.icon{position:relative;width:48px;height:48px;border:1px solid var(--border);border-radius:12px;background:var(--surface);display:inline-flex;align-items:center;justify-content:center;flex:none}
.icon svg{width:24px;height:24px}
.badge{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--primary);color:var(--on);font-size:12px;font-weight:700;line-height:20px;display:none}
.badge.on{display:block}
.tbox{position:relative}
.icon.save{position:absolute;top:4px;right:0}
.lg{position:absolute;bottom:-6px;right:-6px;min-width:22px;height:18px;padding:0 4px;border-radius:9px;background:var(--surface);border:1px solid var(--border);font-size:11px;font-weight:700;line-height:16px}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.96);width:min(92vw,400px);background:var(--surface);border-radius:16px;padding:18px;z-index:31;opacity:0;pointer-events:none;transition:opacity .15s,transform .15s}
.modal.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}
#mask2{z-index:30}
.msum{color:var(--muted);margin:6px 0 12px}
.modal input,.fl input{width:100%;font:inherit;font-size:16px;color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:12px;min-height:52px;padding:0 12px}
.fl{display:block;margin-top:10px}.fl span{display:block;font-size:14px;color:var(--muted);margin-bottom:4px}
.err{color:var(--danger);font-size:14px;min-height:22px;margin:4px 0}
.hrrow{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;border-radius:8px}
.hrrow.press{background:var(--soft)}
.mrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.mask.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(88vw,420px);background:var(--bg);border-right:1px solid var(--border);transform:translateX(-102%);transition:transform .22s ease-out;z-index:21;overflow-y:auto;padding:12px 12px 32px}
.drawer.on{transform:none}
.dhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.dhead h2{margin:0}
@media (prefers-reduced-motion:reduce){.mask,.drawer{transition:none}}

.rec{background:var(--surface);border:1px solid var(--border);border-radius:12px;margin-bottom:10px}
.rec-h{display:flex;align-items:center;gap:6px;padding:8px 6px 8px 14px}
.rec-h .info{flex:1;min-width:0}
.rec-h .nm{font-weight:700;overflow-wrap:anywhere}
.rec-h .meta{color:var(--muted);font-size:14px}
.rec-h .out{font-size:20px;font-weight:700;color:var(--primary);text-align:right;white-space:nowrap}
.stat{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:15px;margin-top:2px}
.stat b{font-size:17px}
.rec details{border-top:1px solid var(--border);padding:0 14px}
.rec summary{min-height:44px;display:flex;align-items:center;color:var(--muted);font-size:14px;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding-bottom:12px}
.chip{background:var(--soft);border-radius:8px;padding:2px 8px;font-size:14px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--soft);border-radius:12px;padding:4px;margin:12px 0 4px}
.tab{min-height:44px;border:0;border-radius:9px;background:none;font-weight:600;color:var(--muted)}
.tab.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.durs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px}
.dchip{min-height:44px;min-width:52px;padding:0 12px;border-radius:22px;border:1px solid var(--border);background:var(--surface);font-weight:600}
.dchip.on{background:var(--primary);color:var(--on);border-color:var(--primary)}
.dchip:disabled{opacity:.45}
.durs input{width:84px;min-height:44px;border-radius:22px;border:1px solid var(--border);background:var(--surface);color:var(--text);font:inherit;text-align:center}
.ctrl3{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:10px;margin-top:10px}
.time.over{color:var(--warn)}
.lap.lastp{background:var(--warn);color:#fff}
.btn.warn{color:var(--warn);border-color:var(--warn);font-weight:700}
.foot .k small .hl{display:inline;font-size:13px}
.foot .k small .hv{font-size:15px;color:var(--text)}
.foot .k.sep{border-top:1px solid var(--border);margin-top:6px;padding-top:8px}
.foot.side2{border-color:var(--ok)}
.foot.side2 .big{color:var(--ok)}
.lh{font-size:15px;margin:16px 0 0;color:var(--muted)}
.item .note{flex:1;padding:0 10px;overflow-wrap:anywhere}
.dscreen{position:fixed;inset:0;z-index:40;display:none;background:rgba(0,0,0,.25)}
.dscreen.on{display:block}
.dwrap{position:fixed;left:50%;top:52%;transform:translate(-50%,-50%);width:min(92vw,400px);max-height:88dvh;overflow-y:auto;background:var(--surface);border:2px solid var(--warn);border-radius:18px;padding:0 16px 16px;box-shadow:0 12px 36px rgba(0,0,0,.35);animation:pop .16s ease-out}
@keyframes pop{from{opacity:0;transform:translate(-50%,-46%)}to{opacity:1;transform:translate(-50%,-50%)}}
.dhandle{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.dhandle::before{content:"";width:40px;height:5px;border-radius:3px;background:var(--border);position:absolute;top:6px;left:50%;transform:translateX(-50%)}
.dwrap h2{text-align:center;color:var(--warn);font-size:18px;margin:10px 0 0}
.dtime{font-size:clamp(48px,16vw,72px);font-weight:700;text-align:center;color:var(--warn);line-height:1.1}
.dwrap .lap{min-height:72px;font-size:22px;margin-top:12px}
.qchips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.qchips button{min-height:44px;padding:0 14px;border-radius:22px;border:1px solid var(--border);background:var(--surface)}
.rec .tagm{font-size:12px;font-weight:700;padding:1px 8px;border-radius:8px;background:var(--soft);margin-left:6px;vertical-align:middle}
.dtools{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:6px}
.dtools .btn{min-height:56px;padding:4px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px;font-weight:600;line-height:1.2}
.dtools svg{width:20px;height:20px}
.dmsg{min-height:20px;font-size:14px;color:var(--ok);margin-bottom:6px;text-align:center}
#xText{width:100%;height:200px;font:13px/1.4 ui-monospace,monospace;color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:8px;white-space:pre;overflow:auto}
.rec .who{color:var(--muted);font-size:13px;font-weight:400}
.grow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:8px}
.grow select{width:100%;min-height:52px;font:inherit;font-size:16px;color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:0 10px}
.combo{position:relative}
.sug{position:absolute;left:0;right:0;top:100%;margin-top:2px;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.18);max-height:200px;overflow-y:auto;z-index:5;display:none}
.sug.on{display:block}
.sug .opt{display:flex;align-items:center}
.sug .opt button.pick{flex:1;min-height:44px;text-align:left;padding:0 12px;border:0;background:none;font-size:16px}
.sug .opt button.pick b{color:var(--primary)}
.sug .opt button.rm{width:44px;height:44px;border:0;background:none;color:var(--muted);font-size:18px}
.sug .hint{padding:8px 12px;font-size:13px;color:var(--muted)}
.modal{max-height:92dvh;overflow-y:auto}
.gscroll{overflow-x:auto}
.gtab{min-width:min-content}
.grow2{display:grid;align-items:center;gap:4px;padding:4px 4px 4px 10px;min-height:52px;border-bottom:1px solid var(--border)}
.grow2 .n{color:var(--muted);font-size:14px}
.cell{min-height:44px;display:flex;align-items:center;justify-content:flex-end;padding:0 8px;border-radius:8px;background:var(--soft);font-size:17px;font-weight:600;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:pan-x pan-y;white-space:nowrap}
.cell.emp{background:none;border:1px dashed var(--border)}
.rs{text-align:right;font-size:14px;color:var(--muted);padding-right:4px;white-space:nowrap}
.gavg{background:var(--soft);border-bottom:0}
.gavg .cell{background:var(--surface);color:var(--primary)}
.gavg .rs{color:var(--primary);font-weight:700;font-size:16px}
.cell.ghost{background:none;outline:2px dashed var(--primary);color:var(--primary);opacity:.55}
.fly{position:fixed;left:0;top:0;z-index:60;min-width:72px;padding:10px 12px;border-radius:10px;background:var(--primary);color:var(--on);font-size:20px;font-weight:700;text-align:center;box-shadow:0 10px 24px rgba(0,0,0,.3);pointer-events:none;display:none}
.fly.on{display:block}
body.dragging{user-select:none;-webkit-user-select:none;overscroll-behavior:none}
.dropbar{position:fixed;left:8px;right:8px;bottom:max(10px,env(safe-area-inset-bottom));z-index:55;display:none;grid-template-columns:1fr 1fr;gap:8px;max-width:560px;margin:0 auto}
.dropbar.on{display:grid}
.dz{min-height:64px;border-radius:14px;border:2px dashed var(--primary);background:var(--surface);color:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.dz.del{border-color:var(--danger);color:var(--danger)}
.dz.hot{background:var(--primary);color:var(--on)}
.dz.del.hot{background:var(--danger);color:#fff}
.acell{flex-direction:column;align-items:flex-end;justify-content:center;border:0;font:inherit;line-height:1.15;cursor:pointer;min-height:52px}
.acell span{font-size:17px;font-weight:700}
.acell small{font-size:12px;font-weight:600;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ghead{min-height:30px;padding-top:2px;padding-bottom:2px}
.hl2{text-align:right;font-size:13px;font-weight:700;color:var(--primary);padding:0 8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qchips button.on{background:var(--primary);color:var(--on);border-color:var(--primary)}
.mrow3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><button class="icon" id="openH" aria-label="History"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 103-6.7L3 8M3 3v5h5M12 7v5l3 3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="badge num" id="badge"></span></button><span id="ttl" class="ttl"></span><button class="icon" id="lang"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3 12h18M12 3c2.5 2.6 3.7 5.6 3.7 9s-1.2 6.4-3.7 9c-2.5-2.6-3.7-5.6-3.7-9S9.5 5.6 12 3z" fill="none" stroke="currentColor" stroke-width="1.8"/></svg><span class="lg" id="lg"></span></button></div>
  <div class="tabs" role="tablist"><button class="tab on" id="tab1" role="tab"></button><button class="tab" id="tab2" role="tab"></button></div>
  <section id="m1">
  <div class="tbox"><div class="time num" id="time">0.00</div><button class="icon save" id="save"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h11l3 3v13H5zM8 4v5h7V4M8 20v-6h8v6" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></button></div>
  <div class="sub" id="sub"></div>
  <button class="lap" id="lap"></button>
  <div class="ctrl">
    <button class="btn" id="stop" disabled></button>
    <button class="btn danger" id="clear"></button>
  </div>

  <div class="boxes">
    <div class="foot">
      <div class="k"><span id="lAvg"></span><b class="num" id="avg">—</b></div>
      <div class="k"><span id="lTot"></span><b class="num" id="tot">—</b></div>
      <div class="k hrrow" id="hrRow"><span id="lHr"></span><b class="big num" id="hr">—</b></div>
      <div class="f num" id="formula" hidden></div><div class="f" id="lpHint"></div>
    </div>
    <button class="foot side" id="tgtBox">
      <div class="k"><span id="lTgt"></span><b class="num" id="tgt">—</b></div>
      <div class="k"><span id="lMp"></span><b class="big num" id="mp">—</b><small class="num" id="mpRaw"></small></div>
      <div class="f" id="tgtHint"></div>
    </button>
  </div>

  <div class="list" id="list"></div>
  </section>
  <section id="m2" hidden>
    <div class="durs" id="durs"></div>
    <div class="tbox"><div class="time num" id="cd">10:00</div><button class="icon save" id="save2"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h11l3 3v13H5zM8 4v5h7V4M8 20v-6h8v6" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></button></div>
    <div class="sub" id="sub2"></div>
    <button class="lap" id="plus"></button>
    <div class="ctrl3">
      <button class="btn" id="minus">−1</button>
      <button class="btn warn" id="downBtn"></button>
      <button class="btn danger" id="end2"></button>
    </div>
    <div class="boxes">
      <div class="foot">
        <div class="k"><span id="lCnt"></span><b class="num" id="cntB">—</b></div>
        <div class="k"><span id="lDt"></span><b class="num" id="dtot">—</b></div>
        <div class="k"><span id="lNet"></span><b class="num" id="net">—</b></div>
      </div>
      <div class="foot side2">
        <div class="k"><span id="lSpp"></span><b class="big num" id="spp">—</b><small class="num"><span class="hl" id="lHr2"></span> <b class="hv" id="hr2">—</b></small></div>
        <div class="k sep"><span id="lGross"></span><b class="num" id="gross">—</b><small class="num"><span class="hl" id="lHr3"></span> <b class="hv" id="hr3">—</b></small></div>
      </div>
    </div>
    <h3 class="lh" id="lDl"></h3>
    <div class="list" id="dlist"></div>
  </section>


</div>
<div class="fly num" id="fly" aria-hidden="true"></div>
<div class="dropbar" id="dropbar"><div class="dz" id="dzNew"></div><div class="dz del" id="dzDel"></div></div>
<div class="mask" id="mask"></div>
<div class="modal" id="lbmodal" role="dialog" aria-modal="true" aria-labelledby="lbTitle">
  <h2 id="lbTitle"></h2>
  <div class="qchips" id="lbChips"></div>
  <label class="fl"><span id="lbInL"></span><input type="text" id="lbIn" autocomplete="off"></label>
  <div class="mrow3"><button class="btn danger" id="lbClear"></button><button class="btn" id="lbCancel"></button><button class="btn pri" id="lbOk"></button></div>
</div>
<div class="mask" id="mask2"></div>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <h2 id="mTitle"></h2>
  <div class="msum num" id="msum"></div>
  <div class="fl"><span id="lGrp"></span>
    <div class="grow"><select id="fFac" aria-label="Factory"><option>GLD5</option><option>GLD6</option></select><select id="fLine" aria-label="Line"></select></div>
  </div>
  <div class="fl combo"><span id="lProc"></span><input type="text" id="fProc" autocomplete="off" role="combobox" aria-autocomplete="list" aria-controls="sgProc"><div class="sug" id="sgProc" role="listbox"></div></div>
  <div class="fl combo"><span id="lOpr"></span><input type="text" id="name" autocomplete="off" role="combobox" aria-autocomplete="list" aria-controls="sgOpr"><div class="sug" id="sgOpr" role="listbox"></div></div>
  <div class="mrow"><button class="btn" id="mCancel"></button><button class="btn pri" id="mOk"></button></div>
</div>
<div class="modal" id="cmodal" role="dialog" aria-modal="true" aria-labelledby="cTitle">
  <h2 id="cTitle"></h2>
  <div class="msum num" id="cPrev"></div>
  <label class="fl"><span id="cBaseL"></span><input type="number" id="cBase" inputmode="decimal" min="1" step="1"></label>
  <label class="fl"><span id="cKL"></span><input type="number" id="cK" inputmode="decimal" min="0.01" step="0.01"></label>
  <div class="err" id="cErr"></div>
  <button class="btn" id="cReset" style="width:100%"></button>
  <div class="mrow"><button class="btn" id="cCancel"></button><button class="btn pri" id="cOk"></button></div>
</div>
<div class="modal" id="tmodal" role="dialog" aria-modal="true" aria-labelledby="tTitle">
  <h2 id="tTitle"></h2>
  <label class="fl"><span id="tInL"></span><input type="number" id="tIn" inputmode="numeric" min="1" step="1"></label>
  <div class="err" id="tErr"></div>
  <div class="mrow"><button class="btn" id="tCancel"></button><button class="btn pri" id="tOk"></button></div>
</div>
<div class="dscreen" id="dscreen" role="dialog" aria-modal="true" aria-labelledby="dTitle">
  <div class="dwrap" id="dwrap">
    <div class="dhandle" id="dhandle"><h2 id="dTitle"></h2></div>
    <div class="dtime num" id="dtime">0:00</div>
    <div class="sub num" id="dremain"></div>

const M2KEY='simple_lap_m2_v1';
const m2blank=()=>({durMin:(M2&&M2.durMin)||10,start:0,end:0,count:0,downs:[],cur:null});

let raf2=0,actx=null,wake=null;
const save2=()=>put(M2KEY,M2);
const mmss=ms=>{ms=Math.max(0,ms);const tsec=Math.floor(ms/1000);return Math.floor(tsec/60)+':'+String(tsec%60).padStart(2,'0')};
const durMs=()=>M2.durMin*60000;

function m2stats(R=M2,now=Date.now()){
  const endT=R.end||now, el=R.start?Math.max(0,endT-R.start):0;
  let dt=R.downs.reduce((a,d)=>a+Math.max(0,Math.min(d.e,endT)-d.s),0); if(R.cur) dt+=Math.max(0,endT-R.cur.s);
  const net=Math.max(0,el-dt), spp=R.count?net/1000/R.count:0, gross=R.count?el/1000/R.count:0;
  return {el,dt,net,spp,gross};
}
async function wakeOn(){try{if('wakeLock' in navigator&&!wake)wake=await navigator.wakeLock.request('screen')}catch(e){}}
function wakeOff(){try{wake&&wake.release()}catch(e){};wake=null}

function finish2(at){
  if(!m2run())return;
  M2.end=at||M2.last||Date.now();
  if(M2.cur){if(M2.cur.s<M2.end)M2.downs.push({s:M2.cur.s,e:M2.end,note:M2.cur.note||''});M2.cur=null;$('dscreen').classList.remove('on');}
  M2.downs=M2.downs.filter(d=>d.s<M2.end).map(d=>({...d,e:Math.min(d.e,M2.end)}));
  save2();cancelAnimationFrame(raf2);wakeOff();try{navigator.vibrate&&navigator.vibrate(60)}catch(e){};render2();
}
function tick2(){
  if(!m2run())return;
  const now=Date.now();
  if(!M2.over&&now-M2.start>=durMs()){M2.over=true;save2();beep();render2()}
  paint2(now);raf2=requestAnimationFrame(tick2);
}
function paint2(now=Date.now()){

function paintDrag(){
  const pv=applyMove(laps,drag.src,drag.tgt);
  const show=drag.tgt?pv:{rows:laps.map((r,i)=>i===drag.src.r?r.map((x,j)=>j===drag.src.j?null:x):r),ghost:null};
  $('list').innerHTML=gridHTML(show.rows,drag.cols,{ghost:show.ghost});
  $('dzNew').classList.toggle('hot',drag.tgt==='new');$('dzDel').classList.toggle('hot',drag.tgt==='del');
}
function startDrag(cell,x,y){
  const r=+cell.dataset.r,j=+cell.dataset.j;if(laps[r]==null||laps[r][j]==null)return;
  drag={src:{r,j},v:laps[r][j],tgt:null,cols:Math.max(1,calc(laps).cols)+1};
  const f=$('fly');f.textContent=f2(drag.v);f.classList.add('on');moveFly(x,y);
  document.body.classList.add('dragging');$('dropbar').classList.add('on');
  try{navigator.vibrate&&navigator.vibrate(30)}catch(_){}
  paintDrag();
}
function moveFly(x,y){$('fly').style.transform='translate('+(x-36)+'px,'+(y-46)+'px) scale(1.08)'}
function hitTest(x,y){
  const el=document.elementFromPoint(x,y);if(!el)return null;
  if(el.closest('#dzDel'))return 'del';if(el.closest('#dzNew'))return 'new';
  const row=el.closest('#list .grow2[data-row]');if(!row)return drag.tgt&&drag.tgt.r!=null?drag.tgt:null;
  const cells=[...row.querySelectorAll('.cell')];let j=-1;
  cells.forEach((c,k)=>{const b=c.getBoundingClientRect();if(x>=b.left-2&&x<=b.right+2)j=k});
  if(j<0){const first=cells[0].getBoundingClientRect(),last=cells[cells.length-1].getBoundingClientRect();j=x<first.left?0:(x>last.right?cells.length-1:-1)}
  return j<0?drag.tgt:{r:+row.dataset.row,j};
}
function dragMove(x,y){
  moveFly(x,y);
  if(y<70)scrollBy(0,-12);else if(y>innerHeight-130)scrollBy(0,12);
  const tg=hitTest(x,y);
  const same=(a,b)=>a===b||(a&&b&&typeof a==='object'&&typeof b==='object'&&a.r===b.r&&a.j===b.j);
  if(!same(tg,drag.tgt)){drag.tgt=tg;paintDrag()}
}
function endDrag(){
  if(!drag)return;const d=drag;drag=null;
  $('fly').classList.remove('on');document.body.classList.remove('dragging');$('dropbar').classList.remove('on');
  if(d.tgt){laps=applyMove(laps,d.src,d.tgt).rows.map(trimRow).filter(r=>r.some(x=>x!=null));put(KEY,laps)}
  render();ui();
}
const listEl=$('list');
listEl.addEventListener('touchstart',e=>{const c=e.target.closest('.cell[data-r]');if(!c||e.touches.length>1)return;const p=e.touches[0];lpPt=[p.clientX,p.clientY];clearTimeout(lpT2);lpT2=setTimeout(()=>startDrag(c,lpPt[0],lpPt[1]),420)},{passive:true});
document.addEventListener('touchmove',e=>{const p=e.touches[0];
  if(drag){e.preventDefault();dragMove(p.clientX,p.clientY);return}
  if(lpPt&&Math.hypot(p.clientX-lpPt[0],p.clientY-lpPt[1])>10){clearTimeout(lpT2);lpPt=null}},{passive:false});
document.addEventListener('touchend',()=>{clearTimeout(lpT2);lpPt=null;if(drag)endDrag()});
document.addEventListener('touchcancel',()=>{clearTimeout(lpT2);lpPt=null;if(drag){drag.tgt=null;endDrag()}});
listEl.addEventListener('mousedown',e=>{const c=e.target.closest('.cell[data-r]');if(!c)return;lpPt=[e.clientX,e.clientY];clearTimeout(lpT2);lpT2=setTimeout(()=>startDrag(c,lpPt[0],lpPt[1]),420)});
document.addEventListener('mousemove',e=>{if(drag){dragMove(e.clientX,e.clientY);return}if(lpPt&&Math.hypot(e.clientX-lpPt[0],e.clientY-lpPt[1])>6){clearTimeout(lpT2);lpPt=null}});
document.addEventListener('mouseup',()=>{clearTimeout(lpT2);lpPt=null;if(drag)endDrag()});
listEl.addEventListener('contextmenu',e=>{if(e.target.closest('.cell'))e.preventDefault()});
let armed=false;
$('clear').onclick=()=>{
  if(!laps.length)return;
  if(!armed){armed=true;$('clear').textContent=t().confirm;setTimeout(()=>{armed=false;$('clear').textContent=t().clear},2500);return}
  armed=false;laps=[];put(KEY,laps);stop();render();$('clear').textContent=t().clear;
};
let labJ=0;
function openLab(j){labJ=j;$('lbTitle').textContent=t().labT(j+1);$('lbIn').value=labText(colLab[j])||'';
  $('lbChips').innerHTML=t().presets.map(q=>'<button type="button" class="'+(labText(colLab[j])===q?'on':'')+'">'+esc(q)+'</button>').join('');
  $('lbmodal').classList.add('on');$('mask2').classList.add('on')}
function closeLab(){$('lbmodal').classList.remove('on');$('mask2').classList.remove('on');$('lbIn').blur()}
function setLab(v){while(colLab.length<=labJ)colLab.push('');colLab[labJ]=v;while(colLab.length&&!colLab[colLab.length-1])colLab.pop();put(LKEY,colLab);closeLab();render()}
$('lbChips').addEventListener('click',e=>{const b=e.target.closest('button');if(b)setLab(b.textContent)});
$('lbOk').onclick=()=>setLab($('lbIn').value.trim());$('lbClear').onclick=()=>setLab('');$('lbCancel').onclick=closeLab;
$('lbIn').addEventListener('keydown',e=>{if(e.key==='Enter')setLab($('lbIn').value.trim())});
let saveMode='m1';const LASTK='simple_lap_last_v1',OKEY='simple_lap_opts_v1';
let opts=load(OKEY,null);
if(!opts){opts={proc:[],opr:[]};recs.forEach(r=>{if(r.proc&&!opts.proc.includes(r.proc))opts.proc.push(r.proc);if(r.opr&&!opts.opr.includes(r.opr))opts.opr.push(r.opr)});put(OKEY,opts)}
function fillLines(sel){const n=$('fFac').value.replace('GLD','');$('fLine').innerHTML=Array.from({length:20},(_,i)=>{const v='L'+n+'-'+String(i+1).padStart(2,'0');return '<option'+(v===sel?' selected':'')+'>'+v+'</option>'}).join('')}
$('fFac').onchange=()=>{const last=load(LASTK,{});fillLines(last.fac===$('fFac').value?last.grp:'')};
function remember(k,v){if(!v)return;const a=opts[k].filter(x=>x!==v);a.unshift(v);opts[k]=a.slice(0,300);put(OKEY,opts)}
function setupCombo(inp,box,key,next){
  const show=()=>{const q=inp.value.trim().toLowerCase();
    const list=opts[key].filter(v=>!q||v.toLowerCase().includes(q)).slice(0,30);
    const exact=opts[key].some(v=>v.toLowerCase()===q);
    let h=list.map(v=>{const i=v.toLowerCase().indexOf(q),hl=q&&i>=0?esc(v.slice(0,i))+'<b>'+esc(v.slice(i,i+q.length))+'</b>'+esc(v.slice(i+q.length)):esc(v);
      return '<div class="opt"><button type="button" class="pick" data-v="'+esc(v)+'">'+hl+'</button><button type="button" class="rm" data-rm="'+esc(v)+'" aria-label="remove">×</button></div>'}).join('');
    if(q&&!exact)h+='<div class="hint">“'+esc(inp.value.trim())+'” — '+t().newOpt+'</div>';
    box.innerHTML=h;box.classList.toggle('on',!!h);};
  inp.addEventListener('focus',show);inp.addEventListener('input',show);
  inp.addEventListener('blur',()=>setTimeout(()=>box.classList.remove('on'),150));
  box.addEventListener('pointerdown',e=>e.preventDefault());
  box.addEventListener('click',e=>{const pk=e.target.closest('[data-v]'),rm=e.target.closest('[data-rm]');
    if(pk){inp.value=pk.dataset.v;box.classList.remove('on');next&&next()}
    else if(rm){opts[key]=opts[key].filter(x=>x!==rm.dataset.rm);put(OKEY,opts);show()}});
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'){box.classList.remove('on');next?next():doSave()}});
}
setupCombo($('fProc'),$('sgProc'),'proc',()=>$('name').focus());
setupCombo($('name'),$('sgOpr'),'opr',null);
function flash2(msg){$('sub2').textContent=msg;setTimeout(render2,1800)}
function openSave(){
  saveMode=mode;
  if(mode==='m2'){
    if(!M2.count){flash2(t().needCnt);return}
    const st=m2stats();$('msum').textContent=t().sum2(M2.count,mmss(st.el),f2(st.spp),f2(st.gross));
  }else{
  if(!laps.length){flash(t().needLoop);return}
  const {avg,hr}=calc(laps);
  $('msum').textContent=t().cnt(laps.length)+' · '+f2(avg)+' '+t().sec+' · '+(hr?hr.toFixed(1):'—')+' '+t().pcs+t().perHr;
  }
  const last=load(LASTK,{});$('fFac').value=last.fac||'GLD6';fillLines(last.grp);$('fProc').value=last.proc||'';$('name').value='';
  $('modal').classList.add('on');$('mask2').classList.add('on');
}
function closeSave(){$('modal').classList.remove('on');$('mask2').classList.remove('on');$('name').blur()}
function doSave(){
  const d=new Date(),p=n=>String(n).padStart(2,'0');
  const who={fac:$('fFac').value,grp:$('fLine').value,proc:$('fProc').value.trim(),opr:$('name').value.trim(),ts:d.getTime()};
  put(LASTK,{fac:who.fac,grp:who.grp,proc:who.proc});remember('proc',who.proc);remember('opr',who.opr);
  $('sgProc').classList.remove('on');$('sgOpr').classList.remove('on');
  who.name=[who.grp,who.proc,who.opr].filter(Boolean).join(' · ');
  if(saveMode==='m2'){
    if(m2run())finish2();
    const R=JSON.parse(JSON.stringify(M2));
    recs.unshift({...who,type:'count',date:p(d.getDate())+'/'+p(d.getMonth()+1)+' '+p(d.getHours())+':'+p(d.getMinutes()),m2:R,cfg:Object.assign({},cfg)});
    put(RKEY,recs);M2=m2blank();save2();$('name').value='';closeSave();render2();renderRecs();flash2(t().saved);return;
  }
  recs.unshift({...who,date:p(d.getDate())+'/'+p(d.getMonth()+1)+' '+p(d.getHours())+':'+p(d.getMinutes()),laps:laps.map(r=>r.slice()),cols:colLab.slice(),cfg:Object.assign({},cfg),target:target||0});
  put(RKEY,recs);
  laps=[];put(KEY,laps);stop();$('name').value='';closeSave();render();renderRecs();flash(t().saved);
}
$('save').onclick=openSave;$('save2').onclick=openSave;$('mCancel').onclick=closeSave;$('mask2').onclick=()=>{closeSave();closeCfg();closeTgt();closeLab()};$('mOk').onclick=doSave;

function cPreview(){const b=parseFloat($('cBase').value),k=parseFloat($('cK').value);$('cPrev').textContent=(isFinite(b)?b:'?')+' ÷ ('+t().fx+' × '+(isFinite(k)?k:'?')+')'}
function openCfg(){$('cBase').value=cfg.base;$('cK').value=cfg.k;$('cErr').textContent='';cPreview();$('cmodal').classList.add('on');$('mask2').classList.add('on')}
function closeCfg(){$('cmodal').classList.remove('on');$('mask2').classList.remove('on')}
$('cBase').oninput=cPreview;$('cK').oninput=cPreview;
$('cReset').onclick=()=>{$('cBase').value=DEF.base;$('cK').value=DEF.k;$('cErr').textContent='';cPreview()};
$('cCancel').onclick=closeCfg;
$('cOk').onclick=()=>{const b=parseFloat($('cBase').value),k=parseFloat($('cK').value);
  if(!(b>0)||!(k>0)){$('cErr').textContent=t().bad;return}
  cfg={base:b,k:k};put(CKEY,cfg);closeCfg();render();render2();flash(t().cfgSaved)};
let lpT=0;const hrRow=$('hrRow');
const lpStart=e=>{hrRow.classList.add('press');lpT=setTimeout(()=>{hrRow.classList.remove('press');try{navigator.vibrate&&navigator.vibrate(40)}catch(_){};openCfg()},600)};
const lpEnd=()=>{clearTimeout(lpT);hrRow.classList.remove('press')};
hrRow.addEventListener('pointerdown',lpStart);['pointerup','pointerleave','pointercancel'].forEach(ev=>hrRow.addEventListener(ev,lpEnd));
hrRow.addEventListener('contextmenu',e=>e.preventDefault());
function openTgt(){$('tIn').value=target||'';$('tErr').textContent='';$('tmodal').classList.add('on');$('mask2').classList.add('on');setTimeout(()=>$('tIn').focus(),50)}
function closeTgt(){$('tmodal').classList.remove('on');$('mask2').classList.remove('on');$('tIn').blur()}
function okTgt(){const v=parseFloat($('tIn').value);if(!(v>0)){$('tErr').textContent=t().bad;return}target=Math.round(v*10)/10;put(TKEY,target);closeTgt();render();flash(t().tgtSet)}
$('tgtBox').onclick=openTgt;$('tCancel').onclick=closeTgt;$('tOk').onclick=okTgt;
$('tIn').addEventListener('keydown',e=>{if(e.key==='Enter')okTgt()});
let armedRec=-1,armTimer=0;
$('recs').onclick=e=>{
  const b=e.target.closest('[data-r]');if(!b)return;
  const i=+b.dataset.r;
  if(armedRec!==i){renderRecs();armedRec=i;const nb=$('recs').querySelector('[data-r="'+i+'"]');nb.textContent=t().delRecQ;nb.style.width='auto';nb.style.padding='0 10px';nb.style.fontSize='14px';nb.style.fontWeight='700';clearTimeout(armTimer);armTimer=setTimeout(()=>{armedRec=-1;renderRecs()},2500);return}
  armedRec=-1;recs.splice(i,1);put(RKEY,recs);renderRecs();
};
const d0=()=>['modal','cmodal','tmodal','xmodal','lbmodal'].some(id=>$(id).classList.contains('on'));
function openH(){$('drawer').classList.add('on');$('mask').classList.add('on');$('drawer').setAttribute('aria-hidden','false');$('closeH').focus()}
function closeH(){$('drawer').classList.remove('on');$('mask').classList.remove('on');$('drawer').setAttribute('aria-hidden','true')}
$('openH').onclick=openH;$('closeH').onclick=closeH;$('mask').onclick=closeH;
let sx=0,sy=0,st=0;
let sIn=false;document.addEventListener('touchstart',e=>{const p=e.touches[0];sx=p.clientX;sy=p.clientY;st=Date.now();sIn=!!(e.target.closest&&e.target.closest('.gscroll,#dropbar'))},{passive:true});
document.addEventListener('touchend',e=>{const p=e.changedTouches[0],dx=p.clientX-sx,dy=p.clientY-sy;
  if(sIn||drag)return;
  if(Math.abs(dx)<70||Math.abs(dy)>Math.abs(dx)*0.6||Date.now()-st>800)return;
  if(d0()||$('dscreen').classList.contains('on'))return;
  const on=$('drawer').classList.contains('on');
  if(dx>0&&!on)openH(); else if(dx<0&&on)closeH();
},{passive:true});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeLab();closeX();closeH();closeSave();closeCfg();closeTgt()}});
$('lang').onclick=()=>{lang=lang==='id'?'zh':'id';applyLang()};
document.addEventListener('keydown',e=>{if(e.code==='Space'&&!/BUTTON|INPUT/.test(e.target.tagName)&&!$('drawer').classList.contains('on')&&!d0()){e.preventDefault();if(mode==='m2'){if(!$('dscreen').classList.contains('on'))$('plus').click()}else lap()}});
applyLang();setMode(mode);
if(M2.cur)$('dscreen').classList.add('on');
if(m2run()){wakeOn();tick2()}
}
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{})}
